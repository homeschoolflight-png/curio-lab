name: Supabase Keepalive

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Query zones table
        run: |
          curl -s -o /dev/null -w "zones: %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/zones?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Query sparks table
        run: |
          curl -s -o /dev/null -w "sparks: %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/sparks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Query experiments table
        run: |
          curl -s -o /dev/null -w "experiments: %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/experiments?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Record a tiny keepalive commit
        run: |
          mkdir -p .github
          echo "Last run: $(date -u)" > .github/keepalive-log.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add .github/keepalive-log.txt
          git commit -m "keepalive: $(date -u +%Y-%m-%d) [skip netlify]" || echo "nothing to commit"
          git push
